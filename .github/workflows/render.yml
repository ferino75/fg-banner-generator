name: Render FG banners

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID (e.g. auto-lightbox) or all"
        required: true
        default: "all"
        type: string

  push:
    paths:
      - "render.py"
      - "projects.json"
      - "requirements.txt"
      - "templates/**"
      - "assets/**"

concurrency:
  group: fg-banner-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Sync Tabler Icons
        run: python sync_icons.py

      - name: Select project
        id: selection
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT="${{ inputs.project_id }}"
          else
            PROJECT="all"
          fi

          PROJECT="$(echo "$PROJECT" | xargs)"

          if [ -z "$PROJECT" ]; then
            PROJECT="all"
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Rendering: $PROJECT"

      - name: Validate project ID
        if: steps.selection.outputs.project != 'all'
        shell: bash
        run: |
          PROJECT="${{ steps.selection.outputs.project }}"

          if ! python render.py list | awk '{print $1}' | grep -Fxq "$PROJECT"; then
            echo "::error::Unknown project ID: $PROJECT"
            echo
            echo "Available projects:"
            python render.py list
            exit 1
          fi

      - name: Diagnostic - before render
        shell: bash
        run: |
          echo "=== Git status before render ==="
          git status --short

          echo
          echo "=== Output files before render ==="
          find output -maxdepth 1 -type f -print -exec sha256sum {} \; 2>/dev/null || true

          echo
          echo "=== Selected logo/config ==="
          PROJECT="${{ steps.selection.outputs.project }}"
          echo "Project: $PROJECT"

          if [ "$PROJECT" != "all" ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          project_id = """${{ steps.selection.outputs.project }}"""
          data = json.loads(Path("projects.json").read_text(encoding="utf-8"))

          for project in data.get("projects", []):
              if project.get("id") == project_id:
                  print("Config:", project)
                  logo = project.get("logo")
                  if logo:
                      p = Path(logo)
                      print("Logo path:", p)
                      print("Logo exists:", p.exists())
                      if p.exists():
                          print("Logo bytes:", p.stat().st_size)
                  break
          PY
          fi

      - name: Render banner(s)
        shell: bash
        run: |
          python render.py "${{ steps.selection.outputs.project }}"

      - name: Diagnostic - after render
        shell: bash
        run: |
          echo "=== Output files after render ==="
          find output -maxdepth 1 -type f -print -exec sha256sum {} \; 2>/dev/null || true

          echo
          echo "=== Git status after render ==="
          git status --short

          echo
          echo "=== Changed output files ==="
          git diff --name-status -- output/ || true

      - name: Stage generated output
        shell: bash
        run: |
          # -f guarantees that output files are staged even if an ignore rule
          # exists locally or is added later.
          git add -f output/

          echo "=== Staged changes ==="
          git diff --cached --name-status
          echo
          git diff --cached --stat

      - name: Commit generated output
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No banner changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PROJECT="${{ steps.selection.outputs.project }}"
          git commit -m "Render FG banner: ${PROJECT}"
          git push
